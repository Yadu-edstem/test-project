spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: false
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto

logging:
  level:
    com.edstem: INFO

app:
  short-link:
    base-url: http://localhost:8080
  security:
    jwt-secret: ""
    access-token-ttl: 15m
    admin-email: ""
    admin-password: ""
